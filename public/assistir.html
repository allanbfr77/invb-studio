<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nova Vida Botafogo</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a0b">
  <meta property="og:title" content="Nova Vida Botafogo">
  <meta property="og:description" content="Um trecho da pregação.">
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" href="/img/nv-v.png?v=2" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <!-- Página pública de um corte compartilhado (/v/<código>): só este vídeo, sem login e sem nada do resto do Studio. -->
  <style>
    :root { --bg: #0a0a0b; --fg: #f5f3ee; --muted: #a8a59d; --gold: #f0b93a; --card: #121214; --border: #262629; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: 'Figtree', system-ui, -apple-system, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; min-height: 100dvh; padding: 20px 16px 28px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    header img { height: 30px; width: auto; display: block; }
    header span { font: 800 11px/1 'Montserrat', sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); border-left: 1px solid var(--border); padding-left: 12px; }
    main { width: 100%; max-width: 960px; display: flex; flex-direction: column; align-items: center; flex: 1; }
    .player { position: relative; width: 100%; max-width: 960px; border-radius: 16px; overflow: hidden; background: #000; box-shadow: 0 24px 60px rgba(0,0,0,.6); }
    .player.v { max-width: min(420px, calc((100dvh - 190px) * 9 / 16)); }
    video { display: block; width: 100%; height: auto; background: #000; }
    h1 { font: 800 clamp(18px, 4.5vw, 26px)/1.25 'Montserrat', sans-serif; text-align: center; margin: 18px 0 6px; max-width: 640px; }
    .gold { width: 48px; height: 4px; border-radius: 4px; background: var(--gold); margin: 4px auto 0; }
    .msg { margin-top: 60px; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 380px; }
    .msg b { display: block; color: var(--fg); font: 800 20px/1.3 'Montserrat', sans-serif; margin-bottom: 6px; }
    footer { margin-top: 22px; font-size: 12.5px; color: var(--muted); text-align: center; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header><img src="/img/nv-logo-noturno.png" alt="Nova Vida Botafogo"><span>Pregação</span></header>
  <main>
    <div class="player" id="player" hidden><video id="v" controls playsinline preload="metadata"></video></div>
    <h1 id="t" hidden></h1><div class="gold" id="g" hidden></div>
    <div class="msg" id="msg">Carregando…</div>
  </main>
  <footer>Nova Vida Botafogo</footer>
  <script>
    (function () {
      var m = /^\/v\/([A-Za-z0-9_-]{20,40})\/?$/.exec(location.pathname);
      var msg = document.getElementById('msg');
      var fail = function () {
        msg.innerHTML = '<b>Este link não está disponível</b>O corte pode ter deixado de ser compartilhado, ou o computador da igreja que guarda o vídeo está desligado.';
      };
      if (!m) return fail();
      var t = m[1];
      fetch('/api/public/' + t + '/info')
        .then(function (r) {
          if (!r.ok) throw new Error();
          return r.json();
        })
        .then(function (i) {
          document.title = i.title + ' · Nova Vida Botafogo';
          var h = document.getElementById('t');
          h.textContent = i.title;
          h.hidden = false;
          document.getElementById('g').hidden = false;
          var p = document.getElementById('player');
          if (i.vertical || i.format === '4:5' || i.format === '1:1') p.classList.add('v');
          var v = document.getElementById('v');
          v.src = '/api/public/' + t + '/video';
          p.hidden = false;
          msg.hidden = true;
          v.addEventListener('error', fail);
        })
        .catch(fail);
    })();
  </script>
</body>
</html>
